services:
  - type: web
    name: analyst-studio
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /_health
    envVars:
      - key: REFLEX_CHECK_LATEST_VERSION
        value: "false"
      - key: REFLEX_USE_GRANIAN
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
